<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>FireRSS Settings</title>
        <link media="all" rel="stylesheet" href="/css/settings.css" />
    </head>
    <body>
        <header><h1>FireRSS</h1></header>
        <section id="migration_notice" class="migration-notice" role="alert" hidden>
            <h2>FireRSS 3 Breaking Change</h2>
            <p>
                The settings model and Exact Host matching changed. Your pre-upgrade settings were backed up before
                migration.
            </p>
            <p id="migration_notice_details"></p>
            <div class="migration-actions">
                <button id="migration_download_button" class="settings_action_button" type="button">
                    Download Backup
                </button>
                <button id="migration_dismiss_button" class="settings_action_button" type="button">Dismiss</button>
            </div>
        </section>
        <table aria-label="FireRSS settings">
            <tr>
                <td class="col1 setting_key_area">Color Scheme</td>
                <td class="col2 setting_value_area">
                    <div role="group" aria-label="Color Scheme">
                        <button class="color_scheme_button" type="button" value="light">Light</button>
                        <button class="color_scheme_button" type="button" value="dark">Dark</button>
                        <button class="color_scheme_button" type="button" value="system">System</button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">
                    <label for="theme_selector">Theme</label>
                    <span
                        class="help-icon"
                        role="note"
                        tabindex="0"
                        aria-label="Opening the selector loads the optional theme list from the FireRSS GitHub repository. Selecting a remote theme downloads and stores its colors."
                    >
                        ?
                    </span>
                </td>
                <td class="col2 setting_value_area">
                    <select id="theme_selector">
                        <option value="default">Default</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">
                    Ignored URLs
                    <span
                        class="help-icon"
                        role="note"
                        tabindex="0"
                        aria-label="Skip matching URLs before Feed Templates and all feed-candidate detection. Use Edit to configure the URL pattern and match mode."
                    >
                        ?
                    </span>
                </td>
                <td class="col2 setting_value_area">
                    <div class="setting-editor-summary">
                        <span id="ignored_urls_summary"></span>
                        <button
                            id="edit_ignored_urls"
                            class="settings_action_button"
                            type="button"
                            aria-label="Edit Ignored URLs"
                        >
                            Edit
                        </button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">
                    Feed Templates
                    <span
                        class="help-icon"
                        role="note"
                        tabindex="0"
                        aria-label="Generate a feed candidate URL directly from a matching page URL. Named placeholders such as &lt;channel_name&gt; are copied into the candidate URL. Templates run even when Extended Feed Scan is Off."
                    >
                        ?
                    </span>
                </td>
                <td class="col2 setting_value_area">
                    <div class="setting-editor-summary">
                        <span id="feed_templates_summary"></span>
                        <button
                            id="edit_feed_templates"
                            class="settings_action_button"
                            type="button"
                            aria-label="Edit Feed Templates"
                        >
                            Edit
                        </button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">
                    Extended Scan Exclusions
                    <span
                        class="help-icon"
                        role="note"
                        tabindex="0"
                        aria-label="Skip active common-path requests for matching URLs while still collecting feed candidates advertised by the page or generated by Feed Templates."
                    >
                        ?
                    </span>
                </td>
                <td class="col2 setting_value_area">
                    <div class="setting-editor-summary">
                        <span id="extended_scan_exclusions_summary"></span>
                        <button
                            id="edit_extended_scan_exclusions"
                            class="settings_action_button"
                            type="button"
                            aria-label="Edit Extended Scan Exclusions"
                        >
                            Edit
                        </button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">
                    Extended Feed Scan
                    <span
                        class="help-icon"
                        role="note"
                        tabindex="0"
                        aria-label="Check common feed paths at the website origin without cookies or a referrer. Excluded URLs still use passive page detection and Feed Templates."
                    >
                        ?
                    </span>
                </td>
                <td class="col2 setting_value_area">
                    <div role="group" aria-label="Extended Feed Scan">
                        <button class="extended_feed_scan_button" type="button" value="2">On</button>
                        <button class="extended_feed_scan_button" type="button" value="1">If No Candidate Found</button>
                        <button class="extended_feed_scan_button" type="button" value="0">Off</button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">
                    Browser Sync
                    <span
                        class="help-icon"
                        role="note"
                        tabindex="0"
                        aria-label="Sync settings through Google Sync in Chromium or Mozilla Sync in Firefox. Enable this separately on each installation. Turning it Off keeps existing synced data. Browser ecosystems do not sync with each other."
                    >
                        ?
                    </span>
                </td>
                <td class="col2 setting_value_area">
                    <div role="group" aria-label="Browser Sync">
                        <button class="settings_sync_button" type="button" value="1">On</button>
                        <button class="settings_sync_button" type="button" value="0">Off</button>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">Import / Export</td>
                <td class="col2 setting_value_area">
                    <div class="settings-actions">
                        <button id="settings_export_button" class="settings_action_button" type="button">Export</button>
                        <button id="settings_import_button" class="settings_action_button" type="button">Import</button>
                        <button id="settings_backup_button" class="settings_action_button" type="button" hidden>
                            Legacy Backup
                        </button>
                        <input id="settings_import_file" type="file" accept="application/json,.json" hidden />
                    </div>
                </td>
            </tr>
            <tr>
                <td class="col1 setting_key_area">
                    Reset All Options
                    <span
                        class="help-icon"
                        role="note"
                        tabindex="0"
                        aria-label="Restore every option to its default, disable Browser Sync, and remove synced FireRSS data and the legacy settings backup. Three clicks are required to confirm."
                    >
                        ?
                    </span>
                </td>
                <td class="col2 setting_value_area">
                    <button id="settings_reset_button" class="settings_action_button" type="button">Reset</button>
                </td>
            </tr>
        </table>
        <footer>
            <div class="logo-container">
                <div class="left-icons">
                    <div id="settings_status" role="status" aria-live="polite"></div>
                </div>
                <firerss-external-links></firerss-external-links>
            </div>
        </footer>
        <script src="/js/components.js"></script>
        <script src="/js/settings.js"></script>
    </body>
</html>
